[build]
  publish = "."
  command = "node build.js"

[[edge_functions]]
  path = "/api/contact"
  function = "contact"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Test/dev pages — block from indexing
[[headers]]
  for = "/ma-premiere-page.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/test-cards.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/test-deux-colonnes.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/test-hero-sections.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Let sub-paths work without the catch-all redirect eating them
[[redirects]]
  from = "/case-studies"
  to = "/case-studies/index.html"
  status = 200

[[redirects]]
  from = "/case-studies/*"
  to = "/case-studies/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
