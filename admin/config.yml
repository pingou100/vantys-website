backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  # ─────────────────────────────────────────
  # PAGES (single files mapped to JSON)
  # ─────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    files:

      - label: "Homepage"
        name: "homepage"
        file: "content/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Title Highlight", name: "titleHighlight", widget: "string"}
              - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
              - {label: "CTA Button Text", name: "ctaText", widget: "string"}
              - {label: "CTA Button Link", name: "ctaLink", widget: "string"}
          - label: "Challenge Section"
            name: "challenge"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - label: "Challenges"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - label: "Services Section"
            name: "services"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Section Subtitle", name: "subtitle", widget: "string"}
              - label: "Services"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - label: "Approach Section"
            name: "approach"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Section Subtitle", name: "subtitle", widget: "string"}
              - label: "Approach Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
              - {label: "Button Text", name: "buttonText", widget: "string"}
              - {label: "Button Link", name: "buttonLink", widget: "string"}
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Copyright Text", name: "copyright", widget: "string"}
              - {label: "LinkedIn URL", name: "linkedinUrl", widget: "string"}

      - label: "About Me Page"
        name: "about"
        file: "content/about-me.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Profile Photo", name: "photo", widget: "image"}
          - label: "Content Paragraphs"
            name: "paragraphs"
            widget: "list"
            fields:
              - {label: "Paragraph", name: "text", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}

      - label: "Contact Page"
        name: "contact"
        file: "content/contact.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "LinkedIn URL", name: "linkedinUrl", widget: "string"}
          - {label: "Response Time Note", name: "responseNote", widget: "string"}

      - label: "Privacy Policy"
        name: "privacy"
        file: "content/privacy-policy.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Last Updated", name: "lastUpdated", widget: "string"}
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Content", name: "content", widget: "text"}

  # ─────────────────────────────────────────
  # CASE STUDIES (one JSON file per study)
  # title is the identifier — Decap default
  # slug drives the filename via the slug template
  # ─────────────────────────────────────────
  - name: "case-studies"
    label: "Case Studies"
    label_singular: "Case Study"
    folder: "content/case-studies"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", hint: "Full title shown on the detail page"}
      - {label: "Slug (URL)", name: "slug", widget: "string", hint: "URL-friendly, e.g. proactive-cardiovascular-risk-management"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show as featured card on listing page"}
      - {label: "Short Title", name: "shortTitle", widget: "string", hint: "Shorter title used on listing cards"}
      - {label: "Teaser", name: "teaser", widget: "text", hint: "2-3 sentence summary for the listing page"}
      - {label: "Tags", name: "tags", widget: "list", hint: "e.g. Spain, Cardiovascular, 18 months"}
      - label: "The Challenge"
        name: "challenge"
        widget: "object"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
      - label: "Our Approach"
        name: "approach"
        widget: "object"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - {label: "Intro sentence", name: "intro", widget: "string"}
          - label: "Approach Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
      - label: "The Outcomes"
        name: "outcomes"
        widget: "object"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - label: "Stats (up to 3)"
            name: "stats"
            widget: "list"
            fields:
              - {label: "Number / Metric", name: "number", widget: "string", hint: "e.g. +18% or 18mo"}
              - {label: "Label", name: "label", widget: "string"}
          - label: "Outcome Detail Bullets"
            name: "details"
            widget: "list"
            hint: "One bullet point per item"
      - label: "Sidebar"
        name: "sidebar"
        widget: "object"
        fields:
          - label: "At a Glance items"
            name: "atAGlance"
            widget: "list"
          - label: "Capabilities Deployed"
            name: "capabilities"
            widget: "list"

  # ─────────────────────────────────────────
  # SITE SETTINGS
  # ─────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "content/settings.json"
        fields:
          - {label: "Site Title", name: "siteTitle", widget: "string"}
          - label: "Colors"
            name: "colors"
            widget: "object"
            fields:
              - {label: "Navy", name: "navy", widget: "string", default: "#314969"}
              - {label: "Coral", name: "coral", widget: "string", default: "#F07B4A"}
              - {label: "Golden", name: "golden", widget: "string", default: "#F2AF4C"}
              - {label: "Gray", name: "gray", widget: "string", default: "#697A92"}
              - {label: "Warm Neutral", name: "warmNeutral", widget: "string", default: "#F5F3F0"}
