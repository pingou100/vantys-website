backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  # ─────────────────────────────────────────
  # ARTICLES (BLOG)
  # ─────────────────────────────────────────
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    fields:
      - label: "Publié"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Décochez pour sauvegarder en brouillon sans publier"
      - label: "URL de l'article (slug)"
        name: "slug"
        widget: "string"
        hint: "Exemple : mon-premier-article → accessible sur /blog/mon-premier-article.html. Minuscules, tirets, pas d'espaces."
      - label: "Titre"
        name: "title"
        widget: "string"
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: "Par défaut : aujourd'hui. Modifiable librement."
      - label: "Temps de lecture (minutes)"
        name: "readingTime"
        widget: "number"
        default: 5
        required: false
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Ex: IA, Stratégie commerciale, Life Sciences"
      - label: "Résumé (extrait)"
        name: "excerpt"
        widget: "text"
        hint: "Affiché dans la liste des articles. 1-2 phrases maximum."
      - label: "Image principale (optionnelle)"
        name: "heroImage"
        widget: "image"
        required: false
      - label: "Texte alternatif de l'image"
        name: "heroImageAlt"
        widget: "string"
        required: false
        default: ""
      - label: "Contenu de l'article"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list", "heading-two", "heading-three"]
        editor_components: []
        modes: ["rich_text"]

  # ─────────────────────────────────────────
  # PAGES LIBRES
  # ─────────────────────────────────────────
  - name: "free-pages"
    label: "Pages libres"
    label_singular: "Page libre"
    folder: "content/pages"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    fields:
      - label: "Publié"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Décochez pour masquer cette page sans la supprimer"
      - label: "URL de la page (slug)"
        name: "slug"
        widget: "string"
        hint: "Exemple : nos-services → accessible sur /nos-services.html. Minuscules, tirets, pas d'espaces."
      - label: "Titre de la page"
        name: "title"
        widget: "string"
      - label: "Texte d'introduction"
        name: "intro"
        widget: "text"
        required: false
        hint: "Affiché sous le titre, dans la section hero"
      - label: "Layout principal"
        name: "layout"
        widget: "select"
        default: "text-simple"
        hint: "Définit comment sont affichés les 'Blocs de contenu'. Vous pouvez combiner avec des Cards et/ou des Sections."
        options:
          - { label: "📄 Texte simple (blocs titre + texte)", value: "text-simple" }
          - { label: "🖼️  Deux colonnes (texte + image)", value: "two-columns" }
          - { label: "🃏 Cards (grille de cartes)", value: "cards" }
          - { label: "🏠 Hero + Sections", value: "hero-sections" }
      - label: "Bouton CTA (optionnel)"
        name: "ctaText"
        widget: "string"
        required: false
        hint: "Texte du bouton dans le hero (ex: Nous contacter)"
      - label: "Lien du bouton CTA"
        name: "ctaLink"
        widget: "string"
        required: false
        hint: "Ex: /contact.html"
      - label: "Blocs de contenu"
        name: "blocks"
        widget: "list"
        required: false
        hint: "Texte simple ou Deux colonnes. Affiché en premier."
        fields:
          - { label: "Titre du bloc", name: "heading", widget: "string", required: false }
          - label: "Contenu"
            name: "body"
            widget: "markdown"
            buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
            editor_components: []
            modes: ["rich_text"]
          - { label: "Image (deux colonnes uniquement)", name: "image", widget: "image", required: false }
          - { label: "Texte alternatif de l'image", name: "imageAlt", widget: "string", required: false, default: "" }
          - label: "Position de l'image"
            name: "imagePosition"
            widget: "select"
            default: "right"
            options:
              - { label: "Image à droite", value: "right" }
              - { label: "Image à gauche", value: "left" }
      - label: "Colonnes par ligne (cards)"
        name: "columns"
        widget: "select"
        default: "3"
        required: false
        options:
          - { label: "2 colonnes (cards larges)", value: "2" }
          - { label: "3 colonnes (défaut)", value: "3" }
          - { label: "4 colonnes (cards compactes)", value: "4" }
      - label: "Cards"
        name: "cards"
        widget: "list"
        required: false
        hint: "Affiché après les blocs de contenu."
        fields:
          - { label: "Titre de la carte", name: "title", widget: "string" }
          - label: "Contenu"
            name: "body"
            widget: "markdown"
            buttons: ["bold", "italic", "link", "bulleted-list"]
            editor_components: []
            modes: ["rich_text"]
      - label: "Sections"
        name: "sections"
        widget: "list"
        required: false
        hint: "Affiché en dernier, après les cards."
        fields:
          - { label: "Titre de la section", name: "heading", widget: "string", required: false }
          - label: "Contenu"
            name: "body"
            widget: "markdown"
            buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
            editor_components: []
            modes: ["rich_text"]
          - label: "Fond"
            name: "background"
            widget: "select"
            default: "white"
            options:
              - { label: "Blanc", value: "white" }
              - { label: "Beige neutre", value: "neutral" }

  # ─────────────────────────────────────────
  # PAGES FIXES
  # ─────────────────────────────────────────
  - name: "pages"
    label: "Pages fixes"
    files:

      - label: "Homepage"
        name: "homepage"
        file: "content/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Title Highlight", name: "titleHighlight", widget: "string"}
              - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
              - {label: "CTA Button Text", name: "ctaText", widget: "string"}
              - {label: "CTA Button Link", name: "ctaLink", widget: "string"}
          - label: "Challenge Section"
            name: "challenge"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - label: "Challenges"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - label: "Services Section"
            name: "services"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Section Subtitle", name: "subtitle", widget: "string"}
              - label: "Services"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - label: "Approach Section"
            name: "approach"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Section Subtitle", name: "subtitle", widget: "string"}
              - label: "Approach Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
              - {label: "Button Text", name: "buttonText", widget: "string"}
              - {label: "Button Link", name: "buttonLink", widget: "string"}
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Copyright Text", name: "copyright", widget: "string"}
              - {label: "LinkedIn URL", name: "linkedinUrl", widget: "string"}

      - label: "Case Studies Page"
        name: "case-studies-index"
        file: "content/case-studies-index.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Title Highlight", name: "titleHighlight", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Bottom CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
              - {label: "Button Text", name: "buttonText", widget: "string"}
              - {label: "Button Link", name: "buttonLink", widget: "string"}

      - label: "About Me Page"
        name: "about"
        file: "content/about-me.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Profile Photo", name: "photo", widget: "image"}
          - label: "Content Paragraphs"
            name: "paragraphs"
            widget: "list"
            fields:
              - {label: "Paragraph", name: "text", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}

      - label: "Contact Page"
        name: "contact"
        file: "content/contact.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "LinkedIn URL", name: "linkedinUrl", widget: "string"}
          - {label: "Response Time Note", name: "responseNote", widget: "string"}

      - label: "Privacy Policy"
        name: "privacy"
        file: "content/privacy-policy.json"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Last Updated", name: "lastUpdated", widget: "string"}
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Content", name: "content", widget: "text"}

  # ─────────────────────────────────────────
  # CASE STUDIES
  # ─────────────────────────────────────────
  - name: "case-studies"
    label: "Case Studies"
    label_singular: "Case Study"
    folder: "content/case-studies"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug (URL)", name: "slug", widget: "string"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Short Title", name: "shortTitle", widget: "string"}
      - {label: "Teaser", name: "teaser", widget: "text"}
      - {label: "Tags", name: "tags", widget: "list"}
      - label: "Pathway Illustration"
        name: "pathway"
        widget: "object"
        fields:
          - {label: "Custom SVG image", name: "image", widget: "image", required: false}
          - {label: "Image alt text", name: "alt", widget: "string", required: false, default: "Programme transformation pathway"}
      - label: "The Challenge"
        name: "challenge"
        widget: "object"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], modes: ["rich_text"]}
      - label: "Our Approach"
        name: "approach"
        widget: "object"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - {label: "Intro sentence", name: "intro", widget: "string"}
          - label: "Approach Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
      - label: "The Outcomes"
        name: "outcomes"
        widget: "object"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - label: "Stats (up to 3)"
            name: "stats"
            widget: "list"
            fields:
              - {label: "Number / Metric", name: "number", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
          - {label: "Outcome Detail Bullets", name: "details", widget: "list"}
      - label: "Sidebar"
        name: "sidebar"
        widget: "object"
        fields:
          - {label: "At a Glance items", name: "atAGlance", widget: "list"}
          - {label: "Capabilities Deployed", name: "capabilities", widget: "list"}

  # ─────────────────────────────────────────
  # NAVIGATION + SITE SETTINGS
  # ─────────────────────────────────────────
  - name: "settings"
    label: "Paramètres du site"
    files:

      - label: "Navigation"
        name: "navigation"
        file: "content/navigation.json"
        fields:
          - label: "Liens du menu"
            name: "items"
            widget: "list"
            hint: "Ordre d'affichage dans la barre de navigation. Ajoutez, supprimez ou réordonnez librement."
            fields:
              - { label: "Texte du lien", name: "label", widget: "string", hint: "Ex: Blog, Services, À propos" }
              - { label: "URL", name: "href", widget: "string", hint: "Ex: /blog/ ou /contact.html ou /index.html#services" }

      - label: "Paramètres généraux"
        name: "general"
        file: "content/settings.json"
        fields:
          - {label: "Titre du site", name: "siteTitle", widget: "string"}
          - label: "Couleurs"
            name: "colors"
            widget: "object"
            fields:
              - {label: "Navy", name: "navy", widget: "string", default: "#314969"}
              - {label: "Coral", name: "coral", widget: "string", default: "#F07B4A"}
              - {label: "Golden", name: "golden", widget: "string", default: "#F2AF4C"}
              - {label: "Gray", name: "gray", widget: "string", default: "#697A92"}
              - {label: "Warm Neutral", name: "warmNeutral", widget: "string", default: "#F5F3F0"}
